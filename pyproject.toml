[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoning-agent-template"
version = "0.1.0"
description = "Local-first heavy-reasoning agent template with evidence, gates, memory, skills, and optional Deep Agents runtime."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
reasoning-agent = "reasoning_agent_template.cli:main"

[project.optional-dependencies]
deepagents = [
  "deepagents",
  "langgraph",
]
dev = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reasoning_agent_template = ["web_static/*.html", "web_static/*.css", "web_static/*.js"]
